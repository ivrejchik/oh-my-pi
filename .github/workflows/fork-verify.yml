# Builds and verifies every push to `custom` (typecheck, the fork's tests,
# bundled agents), so a manual omp-sync pulls code that is known to work.
# Upstream merges are verified by fork-upstream-sync before it pushes them.
name: fork-verify

on:
   push:
      branches: [custom]
      paths:
         - "packages/**"
         - "scripts/fork/**"
         - "package.json"
         - "bun.lock"
         - ".github/workflows/fork-verify.yml"
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: fork-verify
   cancel-in-progress: true

jobs:
   verify:
      if: "github.repository == 'ivrejchik/oh-my-pi' && !startsWith(github.event.head_commit.message, 'chore(fork): merge upstream')"
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              # verify.sh diffs against the nearest upstream release tag.
              fetch-depth: 0
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Install dependencies and natives
           run: scripts/fork/install.sh --no-launcher
         - name: Verify fork
           run: scripts/fork/verify.sh
